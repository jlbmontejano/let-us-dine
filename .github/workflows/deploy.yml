name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run tests
        run: npx jest --testPathPattern=unit
        working-directory: ./backend
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/letusdine:latest

      - name: Deploy to Droplet
        run: |
          echo "${{ secrets.DROPLET_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} \
            "mkdir -p /app && \
             echo 'POSTGRES_USER=${{ secrets.POSTGRES_USER }}' > /app/.env && \
             echo 'POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}' >> /app/.env && \
             echo 'POSTGRES_DB=${{ secrets.POSTGRES_DB }}' >> /app/.env && \
             echo 'DATABASE_URL=${{ secrets.DATABASE_URL }}' >> /app/.env && \
             echo 'GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}' >> /app/.env && \
             echo 'ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}' >> /app/.env && \
             echo 'FRONTEND_URL=${{ secrets.FRONTEND_URL }}' >> /app/.env && \
             echo 'PORT=8080' >> /app/.env && \
             cd /app && \
             docker compose pull && \
             docker compose up -d --force-recreate"
          rm /tmp/deploy_key
