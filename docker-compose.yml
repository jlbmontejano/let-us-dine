services:
    db:
        image: postgres:16-alpine
        container_name: letusdine-db
        restart: unless-stopped
        environment:
            DATABASE_URL: ${DATABASE_URL}
            NODE_ENV: production
            GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
            ADMIN_API_KEY: ${ADMIN_API_KEY}
            FRONTEND_URL: ${FRONTEND_URL}
            PORT: ${PORT}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        # Not exposed to the internet — only accessible to the app container

    app:
        image: jlbmontejano/letusdine:latest
        build: .
        container_name: letusdine-app
        restart: unless-stopped
        ports:
            - "80:8080"
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            NODE_ENV: production
        depends_on:
            - db

volumes:
    postgres_data:
